# RPi4 Kiosk Configuration
kiosk:
  name: "Barangay Dolores Kiosk 1"
  location: "Barangay Hall, Taytay, Rizal"
  serial:
    port: "/dev/ttyUSB0"
    baud_rate: 115200
    timeout: 5
  api:
    base_url: "http://localhost:8000/api/v1"
    # For production, set to your deployed API URL
    # base_url: "https://your-api-domain.com/api/v1"
  display:
    fullscreen: true
    refresh_interval_seconds: 30
